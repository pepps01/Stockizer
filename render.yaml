# Render Blueprint: the Stockiser API (Flask) on the free web service plan.
# Secrets marked sync: false are entered in the Render dashboard on first deploy.
services:
  - type: web
    name: stockiser-api
    runtime: python
    plan: free
    region: singapore  # nearest Render region to the TiDB instance (Tokyo)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # TiDB: mysql+pymysql://USER:PASS@HOST:4000/stockiser?ssl_ca=/etc/ssl/certs/ca-certificates.crt&ssl_verify_cert=true&ssl_verify_identity=true
      - key: CORS_ORIGINS
        sync: false  # e.g. https://stockiser.vercel.app
      - key: FRONTEND_URL
        sync: false  # same as the Vercel URL
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "0"
      # Render chain: visitor, Cloudflare edge, Render router (seen via /api/admin/request-info).
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: ADVISER_WORKER
        value: "1"
      # Memory (free plan: 512 MB). Two malloc arenas instead of one per thread
      # stop glibc fragmenting across the request threads; fewer threads; and
      # the cache warmer refreshes six exchanges per run, in turn.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: GUNICORN_THREADS
        value: "12"
      - key: CACHE_WARM_EXCHANGES
        value: "6"
      - key: CACHE_WARM_INTERVAL
        value: "300"
